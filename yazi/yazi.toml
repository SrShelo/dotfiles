# first of all, run: ya pkg install

[plugin]
prepend_preloaders = [
    # Replace magick, image, video with mediainfo
    { url = "*.{djvu,djv}", run  = "djvu-view" },
    { mime = "{audio,video,image}/*", run = "mediainfo" },
    { mime = "application/subrip", run = "mediainfo" },
]
prepend_previewers = [
    { mime = "application/epub+zip", run = "epub-preview"},
    { url = "*.md", run = "glow" },
    { url = "*.csv", run = "rich-preview"}, # for csv files
    # { url = "*.md", run = "rich-preview" }, # for markdown (.md) files
    { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
    { url = "*.ipynb", run = "rich-preview"}, # for jupyter notebooks (.ipynb)
    { url = "*.json", run = "rich-preview"}, # for json (.json) files
    # { url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
    # { mime = "audio/*",   run = "exifaudio"},
    { mime = "{audio,video,image}/*", run = "mediainfo"},
    { mime = "application/subrip", run = "mediainfo" },

    # Archive previewer
    { mime = "application/*zip",            run = "ouch" },
    { mime = "application/x-tar",           run = "ouch" },
    { mime = "application/x-bzip2",         run = "ouch" },
    { mime = "application/x-7z-compressed", run = "ouch" },
    { mime = "application/x-rar",           run = "ouch" },
    { mime = "application/x-xz",            run = "ouch" },
    { mime = "application/xz",              run = "ouch" },
    # Werid extensions
    { url = "*.vim*", run = "code"},
]

append_previewers = [
    { url = "*", run = "hexyl" },
]

prepend_fetchers = [
    # git: https://github.com/yazi-rs/plugins/tree/main/git.yazi
    { group = "git", url = "*", run = "git" },
    { group = "git", url = "*/", run = "git" },
]

[mgr]
title_format="yazi - {cwd}"
ratio = [1, 4, 4]
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
sort_reverse = false
sort_translit = true
linemode = "none"
show_symlink = true
scrolloff = 7

[preview]
wrap = "no"

[opener]
edit = [
    { run = 'nvim %s', block = true, for = "unix", desc = "Edit here" },
]
edit_out = [
    { run = 'kitty -e nvim %s', orphan = true, for = "unix", desc = "Edit in new terminal" },
]
# Go into the folder when is opened
dir = [
    { run = 'ya emit cd "$1"', for = "unix", desc = "Enter" },
]
read = [
    { run = 'nohup xdg-open "$@" &', for = "unix", desc = "Read" }
]
open = [
    { run = "xdg-open %s1", orphan = true, desc = "Open" },
]
[open]
rules = [
    # Folder (to open go into a folder when is opened)
    { mime = "inode/directory", use = [ "dir", "edit", "edit_out", "open", "reveal" ] },
    { url = "*/", use = [ "dir", "edit", "edit_out", "open", "reveal" ] },
    # Text
    { mime = "text/*", use = [ "edit", "edit_out", "reveal" ] },
    # Read
    { mime = "*/{pdf, epub}", use = [ "read", "reveal", "edit", "edit_out" ] },
    { mime = "application/epub+zip", use = [ "read", "reveal", "edit", "edit_out" ] },
    # Image
    { url = "*.svg", use = [ "open", "edit", "edit_out", "reveal" ] },
    { mime = "image/*", use = [ "open", "reveal", "edit", "edit_out" ] },
    # Media
    { mime = "{audio,video}/*", use = [ "play", "reveal", "edit", "edit_out" ] },
    # Archive
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal", "edit", "edit_out" ] },
    # JSON
    { mime = "application/{json,ndjson}", use = [ "edit", "edit_out", "reveal" ] },
    { mime = "*/javascript", use = [ "edit", "edit_out", "reveal" ] },
    # Empty file
    { mime = "inode/empty", use = [ "edit", "edit_out", "reveal" ] },
    # Fallback
    # { url = "*.*", use = [ "edit", "open", "reveal" ] },
    { url = "*", use = [ "edit", "edit_out", "open", "reveal" ] },
]

extract = [
    { run = 'ouch d -y "$@"', desc = "Extract here with ouch", for = "unix" },
    { run = 'ouch d -y %*', desc = "Extract here with ouch", for = "windows" },
]

